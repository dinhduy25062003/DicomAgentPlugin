name: build-and-test
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422
      - run: dotnet restore DicomAgent.sln
      - run: dotnet build DicomAgent.sln --no-restore -c Release
      - run: dotnet test DicomAgent.sln --no-build -c Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
